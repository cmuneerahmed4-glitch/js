<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let guess;
        do {
            guess= Number (prompt("Guess Number"))
            if (guess === 7) {
                document.write("Correct");
            } else{
                document.write("Try Again");
            }
        } while (guess !== 7);
        //Roman Urdu ;
        // jab tak 7 nahi aata loop chalta rahega.
    </script>
</body>
</html>
